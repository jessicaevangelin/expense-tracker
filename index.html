<!DOCTYPE html>
<html>
    <head>
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Expense Tracker</h1>
        <form>
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount">
            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
            <label for="date">Date</label>
            <input type="date" id="date" name="date">
            <label for="note">Note</label>
            <input type="text" id="note" name="note">
            <button type="submit">Add Expense</button>
        </form>
        <h2>Your Expenses</h2>
        <div id="total"></div>
        <select id="filter-category">
            <option value="all">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
        </select>
        <div id="expense-list">No expenses yet.</div>
        <script type="module">
            import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
            import {getFirestore} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
            import {collection, addDoc, onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
            const firebaseConfig={
                apiKey: "AIzaSyBcPQvRVCtv3kLMVZWssTF3pxgCmhRji_c",
                authDomain: "expense-tracker-e604d.firebaseapp.com",
                projectId: "expense-tracker-e604d",
                storageBucket: "expense-tracker-e604d.firebasestorage.app",
                messagingSenderId: "383988167805",
                appId: "1:383988167805:web:0e502234fd9d3b2a772d14"
            };
            const app=initializeApp(firebaseConfig);
            const db=getFirestore(app);
            window.db=db;
            const expensesRef=collection(db,"expenses");
            window.expensesRef=expensesRef;
            window.addDoc=addDoc;
            window.onSnapshot=onSnapshot;
        </script>
        <script src="script.js" defer></script>
    </body>
</html>
